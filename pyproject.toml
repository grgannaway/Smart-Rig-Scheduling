[tool.poetry]
name = "project"
version = "0.2.0"
description = ""
authors = [
    "Austin Bailey <austin.bailey@coterra.com>",
    "David Farnan-Williams <david.farnan@coterra.com>",
]
readme = "README.md"
license = "Proprietary"

[tool.poetry.dependencies]
python = ">=3.9,<3.12"
typing-extensions = "^4.11.0"
ml-utils = "^1.17.4"

[tool.poetry.group.dev.dependencies]
pytest = "^7"
pytest-cov = "^3"
python-semantic-release = "^7"
ruff = "^0"
ipykernel = "^6"

[[tool.poetry.source]]
name = "ml-tools"
url = "https://pkgs.dev.azure.com/coterra/DataAnalysis/_packaging/ml-tools/pypi/simple/"
priority = "supplemental"

[[tool.poetry.source]]
name = "PyPI"
priority = "primary"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.semantic_release]
version_toml = ["pyproject.toml:tool.poetry.version"]
version_variable = ["project/_version.py:__version__"]
branch = "main"
upload_to_release = true
build_command = "pip install poetry && poetry build"
repository_url = "https://pkgs.dev.azure.com/coterra/DataAnalysis/_packaging/ml-tools/pypi/upload/"

[tool.pyright]
exclude = [
    ".history",
    ".git",
    ".github",
    ".devcontainer",
    ".ipynb_checkpoints",
    ".pytest_cache",
    ".ruff_cache",
    ".venv",
    ".vscode",
]
reportInvalidTypeForm = false

[tool.ruff]
exclude = [
    ".history",
    ".git",
    ".github",
    ".devcontainer",
    ".ipynb_checkpoints",
    ".pytest_cache",
    ".ruff_cache",
    ".venv",
    ".vscode",
]
line-length = 88 # Same as Black.

target-version = "py311"

[tool.ruff.lint]
# Enable pycodestyle (`E`) and Pyflakes (`F`) codes by default.
select = ["ALL"]
ignore = [
    "D",
    "DTZ005", # call-datetime-now-without-tzinfo
    "ANN101", # missing-type-self
    "D104",   # undocumented-public-package
    "SIM117", # multiple-with-statements
    "COM812", # missing-trailing-comma
    "ISC001", # isort
]

# Allow autofix for all enabled rules (when `--fix`) is provided.
fixable = [
    "ALL",
    # "A", # All
    # "B", # Bugbear
    # "D", # Docstring
    # "E", # Pycodestyle
    # "F", # Pyflakes
    # "UP006", # non-pep585-annotation
    # "UP007", # non-pep604-annotation
    # "COM812" # missing-trailing-comma
]
unfixable = ["F841"]

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.per-file-ignores]
"tests_*/**/*.py" = [
    # at least this three should be fine in tests:
    "S101", # asserts allowed in tests...
    "ARG",  # Unused function args -> fixtures nevertheless are functionally relevant...
    "FBT",  # Don't care about booleans as positional arguments in tests, e.g. via @pytest.mark.parametrize()
    # The below are debateable
    "PLR2004", # Magic value used in comparison, ...
    "S311",    # Standard pseudo-random generators are not suitable for cryptographic purposes
]


[tool.pytest.ini_options]
minversion = 6.0
addopts = ""
norecursedirs = [
    ".history",
    ".git",
    ".github",
    ".devcontainer",
    ".ipynb_checkpoints",
    ".pytest_cache",
    ".ruff_cache",
    ".venv",
    ".vscode",
]
filterwarnings = [
    "ignore::UserWarning",
    "ignore::DeprecationWarning:pyreadline",
    "ignore::DeprecationWarning:jwt",
    "ignore:FileType Enum is Deprecated in > 1.0.39. Use strings instead.:DeprecationWarning:azureml",
    "ignore:distutils Version classes are deprecated. Use packaging.version instead.",
    "ignore:Importing display from IPython.core.display is deprecated since IPython 7.14, please import from IPython display",
    "error:Converting `np.inexact` or `np.floating` to a dtype is deprecated. The current result is `float64` which is not strictly correct.",
]
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(asctime)s [%(levelname)8s] %(message)s (%(name)s:%(lineno)s)"
markers = ["integration", "notest"]
